<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>声闻于天</title>
  <meta name="description" content="声闻于天：追寻张闻天的时代旋律" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <style>
    :root {
      --ink: #2d241d;
      --muted: #6f5b48;
      --paper: #fff7e9;
      --paper-deep: #ead7b9;
      --red: #8f1f1b;
      --gold: #c9923f;
      --green: #58794a;
      --shadow: 0 18px 42px rgba(45, 36, 29, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 248, 218, 0.8), transparent 34rem),
        linear-gradient(180deg, #f8efd9 0%, #f4dfbd 46%, #e9cfa4 100%);
      overflow-x: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .intro {
      min-height: 100svh;
      display: grid;
      align-items: center;
      padding: 7vh 7vw 12vh;
      position: relative;
      overflow: hidden;
    }

    .intro::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(248, 239, 217, 0.9) 0%, rgba(248, 239, 217, 0.62) 38%, rgba(248, 239, 217, 0.08) 76%),
        radial-gradient(circle at 73% 48%, rgba(143, 31, 27, 0.12), transparent 36rem);
      z-index: 0;
      pointer-events: none;
    }

    .intro-map {
      position: absolute;
      right: clamp(96px, 11vw, 190px);
      top: 58%;
      width: min(740px, 56vw);
      aspect-ratio: 1311 / 1200;
      transform: translateY(-50%);
      z-index: 0;
      pointer-events: none;
      opacity: 0.86;
      mix-blend-mode: darken;
    }

    .intro-map img,
    .intro-map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .intro-map img {
      object-fit: contain;
      filter: saturate(1.02) contrast(0.98) sepia(0.08);
      opacity: 0.9;
    }

    .intro-map::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 52% 48%, rgba(248, 239, 217, 0), rgba(248, 239, 217, 0.42) 72%),
        linear-gradient(90deg, rgba(248, 239, 217, 0.18), rgba(248, 239, 217, 0.08));
      pointer-events: none;
    }

    .intro-route {
      fill: none;
      stroke: #b81918;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1420;
      stroke-dashoffset: 1420;
      filter: drop-shadow(0 3px 2px rgba(112, 18, 15, 0.28));
    }

    .intro-route-halo {
      fill: none;
      stroke: rgba(255, 242, 220, 0.78);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1420;
      stroke-dashoffset: 1420;
    }

    .route-point {
      fill: #b81918;
      stroke: #fff1dd;
      stroke-width: 5;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }

    .route-point:nth-of-type(1) { animation-delay: 0.55s; }
    .route-point:nth-of-type(2) { animation-delay: 2.55s; }
    .route-point:nth-of-type(3) { animation-delay: 5s; }

    .intro-map.is-playing .intro-route,
    .intro-map.is-playing .intro-route-halo {
      animation: drawRoute 4.6s 0.45s ease-out forwards;
    }

    .intro-map.is-playing .route-point {
      animation: popPoint 420ms ease forwards;
    }

    @keyframes drawRoute {
      to { stroke-dashoffset: 0; }
    }

    @keyframes popPoint {
      0% { opacity: 0; transform: scale(0.45); }
      100% { opacity: 1; transform: scale(1); }
    }

    .intro-inner {
      width: min(920px, 100%);
      position: relative;
      z-index: 2;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--red);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .kicker::before {
      content: "";
      width: 44px;
      height: 2px;
      background: var(--red);
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(48px, 11vw, 124px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .intro-copy {
      margin: 24px 0 0;
      max-width: 640px;
      color: #4f4033;
      font-size: clamp(17px, 2.4vw, 24px);
      line-height: 1.75;
    }

    .scroll-cue {
      margin-top: 44px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .scroll-cue span {
      width: 22px;
      height: 38px;
      border: 2px solid currentColor;
      border-radius: 999px;
      position: relative;
    }

    .scroll-cue span::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 4px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      transform: translateX(-50%);
      animation: wheel 1.5s infinite;
    }

    @keyframes wheel {
      0% { opacity: 0; transform: translate(-50%, 0); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, 13px); }
    }

    .journey {
      position: relative;
      background:
        linear-gradient(180deg, rgba(250, 238, 216, 0.92), rgba(235, 211, 175, 0.94)),
        #f3dfbd;
    }

    .story-page {
      position: relative;
      height: 140svh;
      min-height: 780px;
    }

    .stage {
      position: sticky;
      top: 0;
      height: 100svh;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(250, 238, 216, 0.96), rgba(235, 211, 175, 0.9)),
        #f3dfbd;
      isolation: isolate;
    }

    .story-page + .story-page .stage,
    .story-page + .video-section,
    .video-section + .story-page .stage {
      border-top: 1px solid rgba(118, 83, 45, 0.12);
    }

    .sky {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 248, 231, 0.8) 0%, rgba(255, 243, 214, 0.46) 40%, rgba(193, 160, 112, 0.18) 100%);
      z-index: -3;
    }

    .road-wrap {
      position: absolute;
      left: 50%;
      bottom: -10svh;
      width: min(980px, 118vw);
      height: 150svh;
      transform: translateX(-50%) perspective(900px) rotateX(58deg);
      transform-origin: bottom center;
      overflow: hidden;
      z-index: -1;
      border-radius: 48% 48% 0 0;
      box-shadow: inset 0 34px 60px rgba(108, 77, 42, 0.08);
    }

    .road {
      position: absolute;
      inset: -105% 0;
      background-image: none;
      background-position: center top;
      background-size: var(--road-size, cover);
      background-repeat: var(--road-repeat, repeat-y);
      transform: translateY(var(--road-y, 0));
      filter: saturate(0.95) contrast(0.96);
    }

    .scenery {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }

    .scene-img {
      position: absolute;
      left: 50%;
      bottom: 31svh;
      max-width: min(900px, 96vw);
      max-height: 46svh;
      object-fit: contain;
      opacity: 0;
      transform: translate(-50%, 24px) scale(0.96);
      transition: opacity 520ms ease, transform 620ms ease;
      filter: drop-shadow(0 28px 28px rgba(57, 42, 25, 0.18));
    }

    .scene-img.is-wide {
      max-width: min(1480px, 158vw);
      max-height: 68svh;
      bottom: 21svh;
    }

    .scene-img.is-shanghai {
      max-width: min(1240px, 132vw);
      max-height: 58svh;
      bottom: 24svh;
    }

    .scene-img.is-yida {
      max-width: min(1420px, 152vw);
      max-height: 66svh;
      bottom: 21svh;
    }

    .story-page.is-active .scene-img.active,
    .story-page.is-seen .scene-img.active {
      opacity: 0.96;
      transform: translate(-50%, 0) scale(1);
    }

    .story-page.is-long {
      height: 190svh;
      min-height: 1040px;
    }

    .character {
      position: absolute;
      left: 50%;
      bottom: 10svh;
      width: clamp(92px, 18vw, 176px);
      transform: translateX(-50%);
      z-index: 5;
      filter: drop-shadow(0 16px 12px rgba(43, 31, 20, 0.2));
    }

    .character img {
      width: 100%;
      height: auto;
      display: block;
    }

    .content-panel {
      position: absolute;
      left: 50%;
      top: clamp(34px, 7svh, 72px);
      width: min(880px, calc(100vw - 28px));
      padding: 11px 14px 10px;
      background:
        linear-gradient(135deg, rgba(255, 251, 240, 0.62), rgba(246, 230, 201, 0.52));
      border: 1px solid rgba(118, 83, 45, 0.1);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(45, 36, 29, 0.08);
      backdrop-filter: blur(6px);
      transform: translateX(-50%);
      z-index: 8;
    }

    .page-mini-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 7px;
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .page-mini-title::before {
      content: "";
      width: 24px;
      height: 2px;
      background: currentColor;
    }

    .year,
    .panel-title {
      display: none;
    }

    .panel-copy {
      margin: 0;
      color: #493a2d;
      font-size: 14px;
      line-height: 1.52;
    }

    .song-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 6px 9px;
      color: #6c271e;
      background: rgba(143, 31, 27, 0.08);
      border: 1px solid rgba(143, 31, 27, 0.16);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .song-tag::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
    }

    .panel-note {
      margin: 6px 0 0;
      padding-top: 6px;
      border-top: 1px solid rgba(83, 58, 30, 0.16);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .progress {
      position: absolute;
      right: clamp(16px, 4vw, 56px);
      top: 46%;
      display: grid;
      gap: 14px;
      transform: translateY(-50%);
      z-index: 9;
    }

    .dot {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: rgba(79, 64, 51, 0.28);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
      padding: 0;
    }

    .dot.active {
      transform: scale(1.45);
      background: var(--red);
    }

    .chapter-label {
      position: absolute;
      right: clamp(20px, 5vw, 70px);
      bottom: clamp(22px, 6vh, 58px);
      color: rgba(45, 36, 29, 0.36);
      font-size: clamp(42px, 12vw, 124px);
      line-height: 1;
      font-weight: 900;
      z-index: 1;
      pointer-events: none;
      white-space: nowrap;
    }

    .timeline {
      position: absolute;
      left: 50%;
      bottom: 1.6svh;
      width: min(498px, 74vw);
      height: 9px;
      background: url("assets/progress/timeline-empty.png") center / 100% 100% no-repeat;
      transform: translateX(-50%);
      border-radius: 999px;
      z-index: 4;
      overflow: hidden;
    }

    .timeline-fill {
      width: calc(var(--progress, 0) * 100%);
      height: 100%;
      overflow: hidden;
    }

    .timeline-fill::before {
      content: "";
      display: block;
      width: min(498px, 74vw);
      height: 100%;
      background: url("assets/progress/timeline-complete.png") left center / 100% 100% no-repeat;
    }



    /* 全局固定进度条：不再依赖单个页面内部的 timeline */
    .story-page .timeline {
      display: none !important;
    }

    #fixedTimeline {
      position: fixed !important;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(560px, 78vw);
      height: 10px;
      background: url("assets/progress/timeline-empty.png") center / 100% 100% no-repeat;
      transform: translateX(-50%);
      border-radius: 999px;
      z-index: 9999;
      overflow: hidden;
      pointer-events: none;
      filter: drop-shadow(0 6px 12px rgba(45, 36, 29, 0.26));
    }

    #fixedTimelineFill {
      width: calc(var(--global-progress, 0) * 100%);
      height: 100%;
      overflow: hidden;
      transition: width 80ms linear;
    }

    #fixedTimelineFill::before {
      content: "";
      display: block;
      width: min(560px, 78vw);
      height: 100%;
      background: url("assets/progress/timeline-complete.png") left center / 100% 100% no-repeat;
    }

    #fixedProgressDots {
      position: fixed !important;
      right: clamp(14px, 3.5vw, 52px);
      top: 50%;
      display: grid;
      gap: 14px;
      transform: translateY(-50%);
      z-index: 9999;
    }

    #fixedProgressDots .dot {
      box-shadow: 0 4px 12px rgba(45, 36, 29, 0.16);
    }


    /* 不显示每个页面内部的局部侧边点；保留全局固定侧边点与页面小标题 */
    .progress {
      display: none !important;
    }

    .next-page-cue {
      position: absolute;
      left: 50%;
      bottom: 5.2svh;
      transform: translateX(-50%);
      z-index: 9;
      padding: 6px 10px;
      color: rgba(79, 64, 51, 0.72);
      font-size: 12px;
      background: rgba(255, 248, 232, 0.42);
      border: 1px solid rgba(118, 83, 45, 0.12);
      border-radius: 999px;
      pointer-events: none;
    }

    .video-section,
    .end {
      min-height: 100svh;
      display: grid;
      align-items: center;
      padding: 72px 7vw;
      background:
        radial-gradient(circle at 16% 18%, rgba(143, 31, 27, 0.28), transparent 31rem),
        #2f2a24;
      color: #f7ead3;
    }

    .video-inner,
    .end-inner {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    .video-heading {
      display: grid;
      gap: 8px;
      text-align: center;
      justify-items: center;
    }

    .video-heading h2 {
      margin: 0;
      font-size: clamp(30px, 6vw, 64px);
      line-height: 1.1;
    }

    .video-heading p,
    .end p {
      margin: 0;
      max-width: 760px;
      color: rgba(247, 234, 211, 0.82);
      font-size: clamp(17px, 2.4vw, 22px);
      line-height: 1.7;
    }

    .end-copy {
      text-align: center;
      justify-self: center;
      font-size: clamp(21px, 4vw, 36px) !important;
    }

    .ai-lab {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.76fr);
      gap: 18px;
      align-items: stretch;
    }

    .end-ai-lab {
      width: min(780px, 100%);
      margin: 0 auto;
      grid-template-columns: 1fr;
    }

    .classin-note {
      margin: 22px 0 0;
      padding-top: 16px;
      border-top: 1px solid rgba(247, 234, 211, 0.18);
      color: rgba(247, 234, 211, 0.86);
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }

    .material-shelf {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(247, 234, 211, 0.18);
    }

    .material-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .material-heading h3 {
      margin: 0;
      color: #f7ead3;
      font-size: 18px;
      line-height: 1.2;
    }

    .material-heading p {
      margin: 0;
      max-width: 430px;
      color: rgba(247, 234, 211, 0.72);
      font-size: 13px;
      line-height: 1.55;
      text-align: right;
    }

    .material-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }

    .material-tab {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid rgba(247, 234, 211, 0.28);
      border-radius: 6px;
      color: #f7ead3;
      background: rgba(255, 255, 255, 0.08);
      font-size: 13px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .material-tab.active {
      border-color: rgba(201, 146, 63, 0.8);
      background: rgba(143, 31, 27, 0.5);
    }

    .material-panel-note {
      margin: 0 0 12px;
      color: rgba(247, 234, 211, 0.7);
      font-size: 13px;
      line-height: 1.55;
    }

    .material-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 12px;
    }

    .material-card {
      display: grid;
      gap: 9px;
      padding: 10px;
      border: 1px solid rgba(247, 234, 211, 0.18);
      border-radius: 8px;
      background: rgba(255, 248, 232, 0.07);
    }

    .material-preview,
    .material-audio-preview {
      display: grid;
      place-items: center;
      min-height: 134px;
      border-radius: 7px;
      background:
        radial-gradient(circle at 50% 38%, rgba(247, 234, 211, 0.16), transparent 58%),
        rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .material-preview img {
      max-width: 100%;
      max-height: 124px;
      object-fit: contain;
      filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.22));
    }

    .material-card.is-storyboard .material-preview {
      min-height: 112px;
    }

    .material-card.is-storyboard .material-preview img {
      width: 100%;
      max-height: 130px;
    }

    .material-audio-preview {
      min-height: 96px;
      padding: 12px;
    }

    .material-audio-preview audio {
      width: 100%;
    }

    .material-name {
      margin: 0;
      color: #f7ead3;
      font-size: 14px;
      line-height: 1.3;
      text-align: center;
      font-weight: 700;
    }

    .material-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid rgba(201, 146, 63, 0.72);
      border-radius: 6px;
      color: #f7ead3;
      background: rgba(143, 31, 27, 0.42);
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .material-download:hover,
    .material-download:focus-visible {
      border-color: rgba(201, 146, 63, 0.95);
      background: rgba(143, 31, 27, 0.62);
    }

    .material-download.is-loading {
      opacity: 0.72;
      pointer-events: none;
    }

    .material-state {
      min-height: 16px;
      color: rgba(247, 234, 211, 0.68);
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
    }

    .material-lazy-state {
      grid-column: 1 / -1;
      min-height: 96px;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 18px;
      border: 1px dashed rgba(247, 234, 211, 0.18);
      border-radius: 8px;
      color: rgba(247, 234, 211, 0.68);
      background: rgba(255, 248, 232, 0.05);
      font-size: 13px;
      text-align: center;
    }

    .ai-tool,
    .video-drop {
      border: 1px solid rgba(247, 234, 211, 0.18);
      border-radius: 8px;
      background: rgba(255, 248, 232, 0.08);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.18);
      padding: 18px;
    }

    .ai-tool h2,
    .video-drop h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.2;
    }

    .prompt-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .prompt-tab,
    .ai-action,
    .upload-button {
      border: 1px solid rgba(247, 234, 211, 0.28);
      border-radius: 6px;
      color: #f7ead3;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .prompt-tab {
      padding: 8px 11px;
      font-size: 14px;
    }

    .prompt-tab.active,
    .ai-action.primary {
      border-color: rgba(201, 146, 63, 0.8);
      background: rgba(143, 31, 27, 0.5);
    }

    .prompt-box {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid rgba(247, 234, 211, 0.22);
      border-radius: 8px;
      padding: 12px;
      color: #2d241d;
      background: rgba(255, 248, 232, 0.94);
      font-size: 15px;
      line-height: 1.7;
      font-family: inherit;
    }

      .ai-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          margin-top: 12px;
          margin-bottom: 18px;
          align-items: center;
      }

    .ai-action,
    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 12px;
      font-size: 14px;
      text-decoration: none;
    }

    .copy-state,
    .upload-state {
      min-height: 20px;
      color: rgba(247, 234, 211, 0.78);
      font-size: 13px;
    }

    .video-frame {
      position: relative;

      return String(value)

        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function updateGlobalProgress(activeChapterIndex = -1) {
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const globalProgress = clamp(window.scrollY / maxScroll, 0, 1);
      if (fixedTimelineFill) {
        fixedTimelineFill.style.setProperty("--global-progress", globalProgress);
      }

      if (fixedProgressDots) {
        const activeDotIndex = activeChapterIndex >= 0 ? getProgressDotIndex(activeChapterIndex) : 0;
        [...fixedProgressDots.children].forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === activeDotIndex);
        });
      }
    }

    function renderStoryPage(chapter, index) {
      const section = document.createElement("section");
      section.className = `story-page${chapter.longPage ? " is-long" : ""}`;
      section.id = `chapter-${index}`;
      section.dataset.chapterIndex = String(index);
      const sceneItems = chapter.scenes || [{ src: chapter.scene, wide: chapter.wide, sceneClass: chapter.sceneClass }];
      const sceneMarkup = sceneItems.map((scene, sceneIndex) => {
        const sceneClass = ["scene-img", scene.wide ? "is-wide" : "", scene.sceneClass || "", sceneIndex === 0 ? "active" : ""].filter(Boolean).join(" ");
        return `<img class="${sceneClass}" data-scene-step="${sceneIndex}" src="${asset(scene.src)}" alt="" decoding="async" />`;
      }).join("");
      section.innerHTML = `
        <div class="stage">
          <div class="sky"></div>
          <div class="scenery" aria-hidden="true">
            ${sceneMarkup}
          </div>
          <div class="road-wrap" aria-hidden="true"><div class="road"></div></div>
          <article class="content-panel" aria-live="polite">
            <p class="page-mini-title">${escapeHtml(chapter.title)}</p>
            <div class="year">${escapeHtml(chapter.year)}</div>
            <h2 class="panel-title">${escapeHtml(chapter.title)}</h2>
            <p class="panel-copy">${escapeHtml(chapter.copy)}</p>
            <div class="song-tag">${escapeHtml(chapter.song)}</div>
            <p class="panel-note">${escapeHtml(chapter.note)}</p>
          </article>
          <div class="character" aria-hidden="true">
            <img src="${asset(frames[chapter.age][0])}" alt="" decoding="async" />
          </div>
          <div class="chapter-label">${escapeHtml(chapter.label)}</div>
          <div class="timeline" aria-hidden="true"><div class="timeline-fill"></div></div>
          <div class="next-page-cue">继续下滑进入下一页</div>
        </div>
      `;
      journey.appendChild(section);

      pageStates.push({
        section,
        chapter,
        index,
        road: section.querySelector(".road"),
        person: section.querySelector(".character img"),
        sceneImages: [...section.querySelectorAll(".scene-img")],
        timelineFill: section.querySelector(".timeline-fill"),
        currentPersonSrc: "",
        currentRoadSrc: "",
        currentSceneStep: -1
      });
    }

    function renderVideoPage(key) {
      const prompt = videoPrompts[key];
      if (!prompt) return;
      const section = document.createElement("section");
      section.className = "video-section";
      section.id = `video-${key}`;
      section.innerHTML = `
        <div class="video-inner">
          <div class="video-heading">
            <h2>${escapeHtml(prompt.title)}</h2>
            <p>${escapeHtml(prompt.intro)}</p>
          </div>
          <div class="ai-lab" aria-label="${escapeHtml(prompt.label)}AI视频共创">
            <div class="ai-tool">
              <h2>${escapeHtml(prompt.label)}提示词</h2>
              <textarea class="prompt-box" aria-label="${escapeHtml(prompt.label)}即梦视频提示词">${escapeHtml(prompt.text)}</textarea>
              <div class="ai-actions">
                <button class="ai-action primary" type="button" data-copy-local-prompt>复制提示词</button>
                <a class="ai-action" href="https://jimeng.jianying.com/" target="_blank" rel="noopener noreferrer">去即梦生成</a>
                <span class="copy-state"></span>
              </div>
            </div>
            <div class="video-drop">
              <h2>${escapeHtml(prompt.label)}视频播放</h2>
              <div class="video-frame">
                <video controls playsinline></video>
                <div class="video-placeholder">上传${escapeHtml(prompt.label)}场景视频后，在这里播放。</div>
              </div>
              <div class="upload-row">
                <label class="upload-button">
                  上传视频
                  <input class="video-input" type="file" accept="video/mp4,video/webm,video/quicktime,video/*" data-local-video-upload>
                </label>
                <span class="upload-state"></span>
              </div>
            </div>
          </div>
        </div>
      `;
      journey.appendChild(section);
    }

    function getMaterialGroup(key) {
      return materialGroups.find((group) => group.key === key) || materialGroups[0];
    }

    function renderMaterialTabs() {
      if (!materialTabs) return;
      materialTabs.innerHTML = materialGroups.map((group) => {
        const activeClass = group.key === activeMaterialKey ? " active" : "";
        return `<button class="material-tab${activeClass}" type="button" data-material-tab="${escapeHtml(group.key)}">${escapeHtml(group.label)}</button>`;
      }).join("");
    }

    function renderMaterialShelf() {
      if (!materialShelf) return;
      materialShelfReady = true;
      const group = getMaterialGroup(activeMaterialKey);
      if (materialPanelNote) materialPanelNote.textContent = group.note;
      materialShelf.innerHTML = group.items.map((item) => {
        const sources = materialSources(item.src);
        const src = sources[0];
        const fallbackSrcs = sources.slice(1).join("|");
        const type = item.type || "image";
        const downloadText = type === "audio" ? "下载MP3" : "下载PNG";
        const cardClass = ["material-card", item.cardClass || "", type === "audio" ? "is-audio" : ""].filter(Boolean).join(" ");
        const preview = type === "audio"
          ? `<div class="material-audio-preview"><audio controls preload="none" src="${src}" data-fallback-srcs="${escapeHtml(fallbackSrcs)}"></audio></div>`
          : `<div class="material-preview"><img src="${src}" data-fallback-srcs="${escapeHtml(fallbackSrcs)}" alt="${escapeHtml(item.label)}" decoding="async" loading="lazy" fetchpriority="low" referrerpolicy="no-referrer" /></div>`;
        return `
          <article class="${cardClass}">
            ${preview}
            <p class="material-name">${escapeHtml(item.label)}</p>
            <a class="material-download" href="${src}" download="${escapeHtml(item.filename)}" data-download-material data-fallback-srcs="${escapeHtml(sources.slice(1).join("|"))}" data-file-name="${escapeHtml(item.filename)}" data-file-type="${escapeHtml(type)}">${downloadText}</a>
            <span class="material-state" aria-live="polite"></span>
          </article>
        `;
      }).join("");
    }

    function deferMaterialShelf() {
      if (!materialShelf) return;
      materialShelf.innerHTML = `<p class="material-lazy-state">素材栏将在滚动到这里时加载，优先读取当前 zhangwentian GitHub Pages 项目资源。</p>`;
      if (!("IntersectionObserver" in window)) {
        renderMaterialShelf();
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          observer.disconnect();
          renderMaterialShelf();
        }
      }, { rootMargin: "360px 0px" });
      observer.observe(materialShelf);
    }

    function setMaterialGroup(key) {
      activeMaterialKey = getMaterialGroup(key).key;
      renderMaterialTabs();
      renderMaterialShelf();
    }

    async function downloadMaterial(link) {
      const type = link.dataset.fileType || "image";
      const filename = link.dataset.fileName || (type === "audio" ? "音乐示例.mp3" : "素材.png");
      const state = link.parentElement.querySelector(".material-state");
      const urls = [link.href, ...(link.dataset.fallbackSrcs || "").split("|").filter(Boolean)];
      const fileLabel = type === "audio" ? "MP3" : "PNG";

      const fallbackOpen = (url = urls[0]) => {
        const fallback = document.createElement("a");
        fallback.href = url;
        fallback.target = "_blank";
        fallback.rel = "noopener noreferrer";
        document.body.appendChild(fallback);
        fallback.click();
        fallback.remove();
      };

      link.classList.add("is-loading");
      if (state) state.textContent = `正在下载${fileLabel}…`;

      try {
        let blob = null;
        for (const url of urls) {
          try {
            const response = await fetch(url, { mode: "cors", cache: "force-cache" });
            if (!response.ok) continue;
            blob = await response.blob();
            break;
          } catch (error) {
            // 继续尝试下一个备用地址
          }
        }
        if (!blob) throw new Error("download failed");
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = objectUrl;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1200);
        if (state) state.textContent = `${fileLabel}已开始下载`;
      } catch (error) {
        fallbackOpen(urls[1] || urls[0]);
        if (state) state.textContent = `已打开${fileLabel}原文件，可右键另存`;
      } finally {
        window.setTimeout(() => {
          link.classList.remove("is-loading");
          if (state) state.textContent = "";
        }, 2200);
      }
    }

    function renderPages() {
      chapters.forEach((chapter, index) => {
        renderStoryPage(chapter, index);
        if (chapter.videoKey) renderVideoPage(chapter.videoKey);
      });
    }

    function loadChapterAssets(index) {
      resolveChapterAssets(index).forEach(preload);
    }

    function warmAllChapters() {
      const runWhenIdle = window.requestIdleCallback || ((callback) => window.setTimeout(callback, 500));
      let index = 0;
      const warm = () => {
        loadChapterAssets(index);
        index += 1;
        if (index < chapters.length) runWhenIdle(warm);
      };
      runWhenIdle(warm);
    }

    function applyRoadStyle(chapter, road) {
      if (chapter.road.includes("stone")) {
        road.style.setProperty("--road-size", "clamp(300px, 44vw, 460px) auto");
        road.style.setProperty("--road-repeat", "repeat");
      } else if (chapter.road.includes("brick")) {
        road.style.setProperty("--road-size", "clamp(240px, 36vw, 380px) auto");
        road.style.setProperty("--road-repeat", "repeat");
      } else {
        road.style.setProperty("--road-size", "cover");
        road.style.setProperty("--road-repeat", "repeat-y");
      }
    }

    function updateStoryPages() {
      let bestIndex = -1;
      let bestScore = Infinity;
      const viewportMiddle = window.innerHeight * 0.5;

      pageStates.forEach((state) => {
        const rect = state.section.getBoundingClientRect();
        const distanceToMiddle = Math.abs(rect.top + rect.height * 0.5 - viewportMiddle);
        if (rect.top < window.innerHeight && rect.bottom > 0 && distanceToMiddle < bestScore) {
          bestIndex = state.index;
          bestScore = distanceToMiddle;
        }
      });

      pageStates.forEach((state) => {
        const { section, chapter, index, road, person, timelineFill } = state;
        const rect = section.getBoundingClientRect();
        const distance = Math.max(1, section.offsetHeight - window.innerHeight);
        const pageProgress = clamp(-rect.top / distance, 0, 1);
        const isActive = index === bestIndex;
        const frameSet = frames[chapter.age];
        const frameIndex = isScrolling && isActive ? Math.floor((pageProgress * 20) + (window.scrollY / 72)) % frameSet.length : 0;
        const nextPersonSrc = asset(frameSet[frameIndex]);
        const nextRoadSrc = asset(chapter.road);
        const totalProgress = clamp((index + pageProgress) / (chapters.length - 1), 0, 1);

        section.classList.toggle("is-active", isActive);
        if (rect.top < window.innerHeight * 0.8) section.classList.add("is-seen");

        if (state.sceneImages && state.sceneImages.length > 1) {
          const sceneStep = pageProgress < 0.52 ? 0 : 1;
          if (sceneStep !== state.currentSceneStep) {
            state.currentSceneStep = sceneStep;
            state.sceneImages.forEach((img, imgIndex) => {
              img.classList.toggle("active", imgIndex === sceneStep);
            });
          }
        } else if (state.sceneImages && state.sceneImages.length === 1) {
          state.sceneImages[0].classList.add("active");
        }

        if (nextPersonSrc !== state.currentPersonSrc) {
          state.currentPersonSrc = nextPersonSrc;
          person.src = nextPersonSrc;
        }

        if (nextRoadSrc !== state.currentRoadSrc) {
          state.currentRoadSrc = nextRoadSrc;
          road.style.backgroundImage = `url("${nextRoadSrc}")`;
        }

        applyRoadStyle(chapter, road);
        road.style.setProperty("--road-y", `${-pageProgress * 42}%`);
        if (timelineFill) timelineFill.style.setProperty("--progress", totalProgress);
      });

      updateGlobalProgress(bestIndex);
    }

    function requestUpdate() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        updateStoryPages();
      });
    }

    function replayIntroRoute() {
      introMap.classList.remove("is-playing");
      void introMap.offsetWidth;
      introMap.classList.add("is-playing");
    }

    function copyTextFromTextarea(textarea, stateElement) {
      textarea.focus();
      textarea.select();
      const done = () => {
        stateElement.textContent = "已复制";
        window.setTimeout(() => {
          stateElement.textContent = "";
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).then(done).catch(() => {
          document.execCommand("copy");
          done();
        });
      } else {
        document.execCommand("copy");
        done();
      }
    }

    function attachLocalVideo(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const section = input.closest(".video-drop");
      const video = section.querySelector("video");
      const frame = section.querySelector(".video-frame");
      const state = section.querySelector(".upload-state");
      if (video.dataset.objectUrl) URL.revokeObjectURL(video.dataset.objectUrl);
      const objectUrl = URL.createObjectURL(file);
      video.dataset.objectUrl = objectUrl;
      video.src = objectUrl;
      frame.classList.add("has-video");
      state.textContent = file.name;
    }

    renderPages();
    renderFixedProgressDots();
    renderMaterialTabs();
    deferMaterialShelf();

    document.addEventListener("click", (event) => {
      const dot = event.target.closest("[data-jump-chapter]");
      if (dot) {
        const targetIndex = Number(dot.dataset.jumpChapter);
        const target = document.getElementById(`chapter-${targetIndex}`);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      const materialTab = event.target.closest("[data-material-tab]");
      if (materialTab) {
        setMaterialGroup(materialTab.dataset.materialTab);
        return;
      }

      const materialDownload = event.target.closest("[data-download-material]");
      if (materialDownload) {
        event.preventDefault();
        downloadMaterial(materialDownload);
        return;
      }

      const localCopyButton = event.target.closest("[data-copy-local-prompt]");
      if (localCopyButton) {
        const panel = localCopyButton.closest(".ai-tool");
        copyTextFromTextarea(panel.querySelector(".prompt-box"), panel.querySelector(".copy-state"));
      }
    });

    document.addEventListener("change", (event) => {
      const input = event.target.closest("[data-local-video-upload]");
      if (input) attachLocalVideo(input);
    });

    document.addEventListener("error", (event) => {
      const target = event.target;
      if (!target || !target.dataset || !target.dataset.fallbackSrcs) return;
      const sources = target.dataset.fallbackSrcs.split("|").filter(Boolean);
      const nextSource = sources.shift();
      if (!nextSource) return;
      target.dataset.fallbackSrcs = sources.join("|");
      target.src = nextSource;
    }, true);

    window.addEventListener("scroll", () => {
      isScrolling = true;
      window.clearTimeout(scrollStopTimer);
      scrollStopTimer = window.setTimeout(() => {
        isScrolling = false;
        requestUpdate();
      }, 120);
      requestUpdate();
    }, { passive: true });

    window.addEventListener("resize", requestUpdate);

    const introObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && entry.intersectionRatio > 0.55) {
          replayIntroRoute();
        }
      });
    }, { threshold: [0.55] });

    introObserver.observe(intro);

    const promptList = [
      videoPrompts.shanghai1,
      videoPrompts.shanghai2,
      videoPrompts.yanan1,
      videoPrompts.yanan2,
      videoPrompts.hejiang1,
      videoPrompts.hejiang2
    ];

    function setPrompt(index) {
      const prompt = promptList[index];
      promptBox.value = prompt.text;
      [...promptTabs.children].forEach((tab, tabIndex) => {
        tab.classList.toggle("active", tabIndex === index);
      });
      copyState.textContent = "";
    }

    promptList.forEach((prompt, index) => {
      const button = document.createElement("button");
      button.className = "prompt-tab";
      button.type = "button";
      button.textContent = prompt.label;
      button.addEventListener("click", () => setPrompt(index));
      promptTabs.appendChild(button);
    });

    copyPrompt.addEventListener("click", () => copyTextFromTextarea(promptBox, copyState));


    setPrompt(0);
    replayIntroRoute();
    updateStoryPages();
    warmAllChapters();
  </script>
</body>
</html>
